<div class="page page--gray page--login">
  <header class="header">
    <div class="container">
      <div class="header__wrapper">
        <div class="header__left">
          <a class="header__logo-link" href="main.html">
            <img
              class="header__logo"
              src="img/logo.svg"
              alt="6 cities logo"
              width="81"
              height="41"
            />
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="page__main page__main--login">
    <div class="page__login-container container">
      <section class="login">
        <h1 class="login__title">Sign in</h1>
        <form
          (ngSubmit)="onSubmit()"
          [formGroup]="formGroup"
          class="login__form form"
          action="#"
          method="post"
        >
          <div class="login__input-wrapper form__input-wrapper">
            <label class="visually-hidden" for="email__input form__input"
              >E-mail</label
            >
            <input
              formControlName="email"
              id="email__input form__input"
              class="login__input form__input"
              type="email"
              name="email"
              placeholder="Email"
              required=""
            />
            <div
              class="form__error-email"
              *ngIf="
                formGroup.get('email')?.invalid &&
                formGroup.get('email')?.touched
              "
            >
              <small *ngIf="formGroup.get('email')?.errors?.['required']"
                >Email is required</small
              >
              <small *ngIf="formGroup.get('email')?.errors?.['email']"
                >Invalid email format</small
              >
            </div>
          </div>
          <div class="login__input-wrapper form__input-wrapper">
            <label class="visually-hidden" for="login__input form__input"
              >Password</label
            >
            <input
              formControlName="password"
              id="login__input form__input"
              class="login__input form__input"
              type="password"
              name="password"
              placeholder="Password"
              required=""
            />
            <div
              class="form__error-password"
              *ngIf="
                formGroup.get('password')?.invalid &&
                formGroup.get('password')?.touched
              "
            >
              <small *ngIf="formGroup.get('password')?.errors?.['required']"
                >Password is required</small
              >
              <small *ngIf="formGroup.get('password')?.errors?.['pattern']"
                >Invalid password format</small
              >
            </div>
          </div>
          <button
            class="login__submit form__submit button"
            type="submit"
            [disabled]="formGroup.invalid"
          >
            Sign in
          </button>
        </form>
      </section>
      <section class="locations locations--login locations--current">
        <div class="locations__item">
          <a class="locations__item-link" href="#">
            <span>Amsterdam</span>
          </a>
        </div>
      </section>
    </div>
  </main>
</div>
